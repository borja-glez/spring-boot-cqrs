<svg xmlns="http://www.w3.org/2000/svg" width="850" height="714" viewBox="0 0 850 714" role="img" aria-labelledby="hx-title hx-desc">
<title id="hx-title">Hexagonal application with spring-boot-cqrs</title>
<desc id="hx-desc">Three nested rings of one application, with every source dependency pointing inwards. The domain ring in the centre holds the aggregate Order, the domain event OrderPlaced and the repository port OrderRepository; it is plain Java and does not use the library. The application ring around it depends only on the domain and on spring-boot-cqrs-api: its input ports are the messages PlaceOrder (a Command) and FindOrder (a Query), its use cases are PlaceOrderHandler, annotated @CommandHandler, and FindOrderHandler, annotated @QueryHandler, and its output ports are OrderEvents and OrderViews. The infrastructure ring outside holds everything that knows Spring: the driving adapters (OrderController, a REST controller that uses PlaceOrder, and the broker consumers of the spring-boot-cqrs-rabbitmq and spring-boot-cqrs-kafka modules), the driven adapters (OutboxOrderEvents implements OrderEvents and publishes through OutboxEventBus of spring-boot-cqrs-jdbc, JpaOrderRepository implements OrderRepository, JpaOrderViews implements OrderViews), the bus implementations SpringCommandBus and SpringQueryBus of spring-boot-cqrs-core, which run the middleware pipeline before the handler, and the composition root configured by the boot3 or boot4 starter: handlers registered by the starter&#x27;s scan or as @Bean methods with cqrs.handlers.scan-enabled=false, and, with cqrs.transactions.enabled=true, TransactionMiddleware around commands and events, and around queries in a read-only transaction unless cqrs.transactions.queries says otherwise (none opens no transaction). The animation follows a PlaceOrder request: from OrderController to SpringCommandBus, to PlaceOrderHandler, into the Order aggregate, out through the OrderRepository port to JpaOrderRepository, and out through the OrderEvents port to OutboxOrderEvents. Control flows out through the ports while the source dependencies still point inwards.</desc>
