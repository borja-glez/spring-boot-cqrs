spring:
  application:
    name: example-outbox
  datasource:
    url: jdbc:h2:mem:outbox-demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

cqrs:
  naming:
    prefix: example-outbox
  events:
    transactional: false

example:
  outbox:
    publish-delay: 1000
