name: CI

on:
  pull_request:

# Every job builds with the Java 21 toolchain (release 21) and runs the tests on the JDK chosen by
# matrix.test-java through -PtestJavaVersion. setup-java installs both JDKs; the last one listed (21)
# becomes JAVA_HOME for Gradle, and both are exposed to Gradle's toolchain detection through the
# JAVA_HOME_<version>_X64 variables that setup-java exports.
env:
  GRADLE_TOOLCHAIN_ARGS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

jobs:
  quality:
    name: quality (JDK ${{ matrix.test-java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-java: [21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Run library quality gate
        run: ./gradlew quality $GRADLE_TOOLCHAIN_ARGS -PtestJavaVersion=${{ matrix.test-java }}

  boot3-compatibility:
    name: boot3-compatibility (JDK ${{ matrix.test-java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-java: [21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify Boot 3 compatibility path
        run: ./gradlew verifyBoot3Compatibility $GRADLE_TOOLCHAIN_ARGS -PtestJavaVersion=${{ matrix.test-java }}

  boot4-compatibility:
    name: boot4-compatibility (JDK ${{ matrix.test-java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-java: [21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify Boot 4 compatibility path
        run: ./gradlew verifyBoot4Compatibility $GRADLE_TOOLCHAIN_ARGS -PtestJavaVersion=${{ matrix.test-java }}
